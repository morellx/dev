<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <title>Overlay OBS</title>
  <link rel="stylesheet" href="style.css">
  <script src="https://cdn.socket.io/4.7.5/socket.io.min.js"></script>
  <style>
    body {
      margin: 0;
      padding: 0;
      background: transparent !important;
      overflow: hidden;
      display: flex;
      justify-content: center;
      align-items: center;
      height: 100vh;
    }
  </style>
</head>
<body>

  <div id="timerDisplay" class="timer-display">00h 10m 00s</div>

  <script>
    const socket = io();
    const timerDisplay = document.getElementById('timerDisplay');

    // Obtener el ID del temporizador desde la URL (Ej: overlay_2.html?id=timer2)
    const urlParams = new URLSearchParams(window.location.search);
    const timerId = urlParams.get('id') || 'timer1';

    // Pedir el estado inicial al servidor al conectar
    socket.emit('get_status', timerId);

    // Escuchar únicamente los eventos sincronizados para este timerId
    socket.on(`sync_timer_${timerId}`, (data) => {
      if (data.formattedText) timerDisplay.innerText = data.formattedText;
      if (data.color) timerDisplay.style.color = data.color;
      if (data.size) timerDisplay.style.fontSize = `${data.size}px`;
      if (data.bold !== undefined) timerDisplay.style.fontWeight = data.bold ? 'bold' : 'normal';

      if (data.shadow) {
        timerDisplay.style.textShadow = `-${data.shadowDist}px ${data.shadowDist}px ${data.shadowBlur}px rgba(0, 0, 0, 0.8)`;
      } else if (data.shadow === false) {
        timerDisplay.style.textShadow = 'none';
      }
    });
  </script>
</body>
</html>
